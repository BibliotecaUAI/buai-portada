<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Open+Sans:wght@400;700&display=swap">
<title>Cita BUAI</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff}
  .wrap{position:relative;box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 clamp(16px,4vw,48px);text-align:center}
  .line{position:relative;width:180px;height:1px;margin-bottom:clamp(10px,2vh,18px);overflow:visible;
        background:linear-gradient(90deg,transparent,#8f8f8f 20%,#d9d9d9 50%,#8f8f8f 80%,transparent)}
  .line::after{content:"";position:absolute;top:-2px;left:0;width:26px;height:5px;border-radius:50%;
        background:radial-gradient(ellipse at center,rgba(255,255,255,1) 0%,rgba(230,232,238,.7) 35%,rgba(255,255,255,0) 70%);
        filter:blur(.4px);box-shadow:0 0 8px 2px rgba(255,255,255,.35);animation:glint 4.5s ease-in-out infinite}
  @keyframes glint{0%{left:-20px;opacity:0}12%{opacity:1}55%{left:170px;opacity:1}65%,100%{left:170px;opacity:0}}
  #q{position:relative;font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(14px,1.45vw,19px);line-height:1.45;letter-spacing:.4px;max-width:760px;margin:0;color:#d6d6d6}
  #q span{opacity:0;filter:blur(3px);transition:opacity .5s ease,filter .5s ease}
  #q span.on{opacity:1;filter:blur(0)}
  .sig{font-family:"Segoe UI","Open Sans",system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-top:clamp(12px,2.4vh,22px);opacity:0;transition:opacity 1.2s}
  .sig.on{opacity:.75}
  #pen{position:absolute;width:clamp(20px,2vw,28px);pointer-events:none;transform-origin:8% 92%;opacity:0;transition:opacity .6s,left .09s linear,top .09s linear;z-index:2}
  #pen.on{opacity:1;animation:scribble .35s ease-in-out infinite alternate}
  @keyframes scribble{from{transform:translate(-8%,-92%) rotate(-4deg)}to{transform:translate(-8%,-92%) rotate(3deg)}}
  .wrap.fade #q span,.wrap.fade .sig{opacity:0!important;transition:opacity 1.4s}

  /* ===== versión blanca y plateada ===== */
  html,body{background:#fff}
  .line{background:linear-gradient(90deg,transparent,#9a9a9a 20%,#e8e8e8 50%,#9a9a9a 80%,transparent);height:1.5px}
  .line::after{background:radial-gradient(ellipse at center,#fff 0%,rgba(200,200,200,.8) 35%,rgba(200,200,200,0) 70%);box-shadow:0 0 10px 3px rgba(150,150,150,.35)}
  #q{color:#4a4a4a}

</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="line"></div>
  <p id="q">“Cada préstamo es una pregunta que alguien quiso responder…”</p>
  <!-- Pluma antigua -->
  <svg id="pen" viewBox="0 0 100 100" aria-hidden="true" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))">
    <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7a7a7a"/><stop offset=".5" stop-color="#e9e9e9"/><stop offset="1" stop-color="#8f8f8f"/></linearGradient></defs>
    <path d="M6 96 L22 74" stroke="#555" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 77 C30 52 52 22 94 4 C80 26 66 44 46 58 C56 52 66 50 74 46 C60 62 42 72 22 76 Z" fill="url(#g)" opacity=".95"/>
    <path d="M22 76 C44 54 66 30 92 6" stroke="#5a5a5a" stroke-width="1" fill="none" opacity=".7"/>
    <path d="M40 60 l-6 -3 M50 50 l-6 -3 M60 40 l-6 -3 M70 30 l-6 -3 M48 58 l4 -5 M58 50 l4 -5 M66 44 l4 -5" stroke="#5a5a5a" stroke-width=".8" opacity=".6"/>
  </svg>
</div>
<script>
  var q=document.getElementById('q'),pen=document.getElementById('pen'),w=document.getElementById('w');
  var txt=q.textContent;q.textContent='';
  var S=[...txt].map(function(ch){var s=document.createElement('span');s.textContent=ch;q.appendChild(s);return s});
  function place(s){var r=s.getBoundingClientRect(),W=w.getBoundingClientRect();pen.style.left=(r.right-W.left)+'px';pen.style.top=(r.bottom-W.top-r.height*.18)+'px'}
  function run(){
    w.classList.remove('fade');S.forEach(function(s){s.classList.remove('on')});
    var i=0;pen.classList.add('on');place(S[0]);
    (function step(){
      if(i<S.length){S[i].classList.add('on');place(S[i]);i++;setTimeout(step,S[i-1].textContent===' '?140:75+Math.random()*45)}
      else{pen.classList.remove('on');
        setTimeout(function(){w.classList.add('fade')},6500);
        setTimeout(run,8300)}
    })();
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(run,500)});
  window.addEventListener('resize',function(){var on=S.filter(function(s){return s.classList.contains('on')});if(on.length)place(on[on.length-1])});
</script>
</body>
</html>
