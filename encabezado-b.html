<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Open+Sans:wght@400;700&display=swap">
<title>Encabezado de reporte BUAI</title>
<style>
  :root{--bg:#000;--fg:#fff;--soft:rgba(255,255,255,.35);--rule:#3a3a3a;--tag:#1c1c1c;--tagb:rgba(255,255,255,.1);--box:rgba(255,255,255,.2);--boxbg:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.005))}
  body.claro{--bg:#fff;--fg:#111;--soft:rgba(0,0,0,.3);--rule:#c8c8c8;--tag:#f1f1f1;--tagb:rgba(0,0,0,.08);--box:rgba(0,0,0,.15);--boxbg:linear-gradient(180deg,rgba(0,0,0,.035),rgba(0,0,0,.005))}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Selawik","Open Sans",system-ui,sans-serif}
  .p{position:relative;box-sizing:border-box;height:100%;padding:clamp(14px,2.6vw,26px) clamp(10px,1.5vw,18px);display:flex;flex-direction:column;gap:clamp(12px,2.4vh,20px)}
  .mast{display:flex;justify-content:space-between;align-items:center;border-top:3px double var(--fg);border-bottom:1px solid var(--fg);padding:10px 0;font-size:clamp(10px,1.2vw,13px);font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .mast a{color:var(--fg);text-decoration:none;font-weight:400;letter-spacing:1px;text-transform:none;opacity:.75;transition:opacity .3s}
  .mast a:hover{opacity:1}
  .mid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,40px);align-items:stretch}
  .txt{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
  .vol{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-size:15px;letter-spacing:2px;opacity:.8}
  h1{margin:0;font-weight:700;font-size:clamp(24px,3.4vw,44px);line-height:1.1;align-self:flex-start;padding-bottom:8px;border-bottom:2px solid var(--rule)}
  .desc{margin:0;font-size:clamp(13px,1.2vw,15px);line-height:1.55;opacity:.8;max-width:560px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tags span{font-size:12px;padding:5px 10px;background:var(--tag);border:1px solid var(--tagb);border-radius:2px}
  .viz{position:relative;border:1px solid var(--box);border-radius:6px;overflow:hidden;background:var(--boxbg);min-height:150px}
  .viz canvas{position:absolute;inset:0;width:100%;height:100%}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--fg)}
  .cols div{padding:12px 16px 0;border-right:1px solid var(--soft)}
  .cols div:last-child{border-right:none}
  .cols b{display:block;font-weight:700;font-size:clamp(13px,1.4vw,16px)}
  .cols small{display:block;font-size:12px;opacity:.8;margin-top:3px;line-height:1.4}
  @media (max-width:700px){
    .mid{grid-template-columns:1fr}.viz{display:none}
    .cols{grid-template-columns:repeat(2,1fr)}.cols div:nth-child(2){border-right:none}.cols small{display:none}
    .mast span{display:none}
  }

  /* ===== versión blanca y plateada ===== */
  body.claro .mast{border-top:3px double #8f8f8f;border-bottom:1px solid #b9b9b9}
  body.claro h1{background:linear-gradient(100deg,#1c1c1c 0%,#1c1c1c 42%,#9d9d9d 47%,#f1f1f1 50%,#9d9d9d 53%,#1c1c1c 58%,#1c1c1c 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tshine 6s ease-in-out infinite;border-bottom-color:#bdbdbd}
  @keyframes tshine{0%{background-position:110% 0}60%,100%{background-position:-10% 0}}
  body.claro .tags span{background:linear-gradient(180deg,#fafafa,#ececec);border-color:#cfcfcf}
  body.claro .viz{border-color:#cfcfcf;background:linear-gradient(180deg,#fdfdfd,#efefef);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(0,0,0,.06)}
  body.claro .cols{border-top-color:#9a9a9a}
  body.claro .cols div{border-right-color:#cfcfcf}

</style>
</head>
<body>
<div class="p">
  <div class="mast"><span>Universidad Adolfo Ibáñez · Bibliotecas UAI</span><a href="https://alumnosuaicl.sharepoint.com/sites/BibliotecaReportesPowerBi/SitePages/Home.aspx" target="_top">← Volver al estante</a></div>
  <div class="mid">
    <div class="txt">
      <div class="vol" id="vol"></div>
      <h1 id="tit"></h1>
      <p class="desc" id="desc"></p>
      <div class="tags" id="tags"></div>
    </div>
    <div class="viz"><canvas id="cv" aria-hidden="true"></canvas></div>
  </div>
  <div class="cols">
    <div><b>Métricas generales</b><small>La foto completa</small></div>
    <div><b>Detalle</b><small>Cada dato por separado</small></div>
    <div><b>Análisis</b><small>Tendencias y causas</small></div>
    <div><b>Decisiones sugeridas</b><small>Qué hacer con los datos</small></div>
  </div>
</div>
<script>
(function(){
  var AREAS={
    servicios:{vol:'Vol. I',t:'Servicios Bibliotecas',d:'Reporte con los datos anuales de la biblioteca: colección, circulación y obligaciones de información institucional.',tags:['Títulos y ejemplares','Préstamos','Morosos','Datos para marbetes','Reporte EDS','Datos para CNED']},
    adi:{vol:'Vol. II',t:'Investigación ADI',d:'Indicadores de gestión de la Asesoría Documental a la Investigación, para apoyar el seguimiento del servicio y la toma de decisiones.',tags:['Solicitudes','Tipos de asesoría','Usuarios atendidos','Tiempos de respuesta']},
    syllabus:{vol:'Vol. III',t:'Bibliografía Syllabus',d:'Cobertura bibliográfica de las mallas y programas de curso: qué bibliografía está disponible en la colección y qué falta.',tags:['Cobertura por programa','Bibliografía básica','Bibliografía complementaria','Brechas']},
    adq:{vol:'Vol. IV',t:'Adquisiciones',d:'Reporte de las adquisiciones de recursos para la biblioteca, desde el historial de compras hasta las que están en curso.',tags:['Compras históricas','Compras en curso','Matriz de adquisiciones']},
    erec:{vol:'Vol. V',t:'Recursos electrónicos',d:'Mide la cantidad de accesos registrados a través del proxy a los recursos electrónicos suscritos.',tags:['Accesos a bases','Revistas electrónicas','Ebooks']},
    marbetes:{vol:'Vol. VI',t:'Creador de Marbetes',d:'Herramienta para generar los marbetes de la colección a partir de los datos de cada ejemplar.',tags:['Signatura topográfica','Impresión de marbetes']},
    marc:{vol:'Vol. VII',t:'Registros MARC',d:'Detalle de los registros MARC en Folio, para revisar la calidad y consistencia de la catalogación.',tags:['Campos fijos y variables','Posición LDR','Indicadores']},
    auto:{vol:'Vol. VIII',t:'Automatización',d:'Procesos automatizados que llevan datos y reportes a las distintas áreas y bibliotecas.',tags:['Bibliotecas','Dirección','Procesamiento y Metadatos','Difusión','Informática']}
  };
  var Q=new URLSearchParams(location.search),TEMA=(Q.get('tema')||window.TEMA_DEFECTO||'blanco').toLowerCase(),CLARO=TEMA==='blanco';
  if(CLARO)document.body.classList.add('claro');
  var k=(Q.get('area')||'servicios').toLowerCase();if(!AREAS[k])k='servicios';
  var a=AREAS[k];
  document.getElementById('vol').textContent=a.vol;document.getElementById('tit').textContent=a.t;document.getElementById('desc').textContent=a.d;
  document.title=a.t+' · Bibliotecas UAI';
  var tg=document.getElementById('tags');a.tags.forEach(function(s){var e=document.createElement('span');e.textContent=s;tg.appendChild(e)});
  var st={};
  var W=CLARO?'40,40,40':'255,255,255',T=0,BG=CLARO?'#f6f6f6':'#000';
  function A(a){return 'rgba('+W+','+a+')'}
  function line(x,x1,y1,x2,y2,a,lw){x.strokeStyle=A(a);x.lineWidth=lw||1;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
  function dot(x,cx,cy,r,a){x.fillStyle=A(a);x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
  var st={};
  var D={
    /* I · Servicios: estantería de la que salen libros en préstamo y luego vuelven */
    servicios:function(x,w,h,t){
      var s=Math.min(w*.95,h*1.05),cx=w*.5,base=h/2+s*.32,N=13,bw=s*.055,gap=s*.012,tot=N*(bw+gap),x0=cx-tot/2;
      var st0=st.serv;if(!st0){st0=st.serv=[];for(var i=0;i<N;i++)st0.push({h:.42+((i*37)%23)/60,tone:.18+((i*13)%7)/22})}
      line(x,x0-s*.05,base,x0+tot+s*.05,base,.55,1.2);line(x,x0-s*.05,base-s*.62,x0+tot+s*.05,base-s*.62,.22,1);
      var P=5.5,k=Math.floor(t/P),p=(t%P)/P,sel=(k*5+2)%N,label='';
      for(var i=0;i<N;i++){var b=st0[i],bh=s*.55*b.h,bx=x0+i*(bw+gap),by=base-bh,dx=0,dy=0,al=1;
        if(i===sel){
          if(p<.18){dy=-bh*.55*(p/.18)}
          else if(p<.42){dy=-bh*.55;dx=s*.55*((p-.18)/.24);al=1-(p-.18)/.24;label='Préstamo'}
          else if(p<.62){al=0;label='Préstamo'}
          else if(p<.86){dy=-bh*.55;dx=s*.55*(1-(p-.62)/.24);al=(p-.62)/.24;label='Devolución'}
          else{dy=-bh*.55*(1-(p-.86)/.14);label='Devolución'}}
        x.fillStyle=A(b.tone*al);x.fillRect(bx+dx,by+dy,bw,bh);
        x.strokeStyle=A(.55*al);x.lineWidth=1;x.strokeRect(bx+dx+.5,by+dy+.5,bw-1,bh-1);
        line(x,bx+dx+2,by+dy+bh*.18,bx+dx+bw-2,by+dy+bh*.18,.45*al,.8);line(x,bx+dx+2,by+dy+bh*.82,bx+dx+bw-2,by+dy+bh*.82,.45*al,.8)}
      if(typeof silverSheen==='function'){silverSheen(x,w,h,t);x._own=1}
      if(label){var la=Math.sin(Math.min(1,Math.max(0,(p<.62?(p-.18)/.44:(p-.62)/.38)))*Math.PI);
        x.font='700 '+Math.round(s*.03)+'px "Segoe UI",sans-serif';x.textAlign='center';x.fillStyle=A(.85*la);
        x.fillText(label.toUpperCase(),cx,base-s*.7);x.textAlign='left'}
    },
    /* II · Investigación: mapa de neuronas con impulsos */
    adi:function(x,w,h,t){
      var s=st.adi;if(!s){s=st.adi={n:[],e:[]};for(var i=0;i<22;i++)s.n.push({x:Math.random(),y:Math.random(),p:Math.random()*6});
        for(var a=0;a<22;a++)for(var b=a+1;b<22;b++){var dx=s.n[a].x-s.n[b].x,dy=s.n[a].y-s.n[b].y;if(dx*dx+dy*dy<.07)s.e.push([a,b,Math.random()])}}
      s.e.forEach(function(e){var A1=s.n[e[0]],B1=s.n[e[1]];line(x,A1.x*w,A1.y*h,B1.x*w,B1.y*h,.13,.8);
        var k=(t*.25+e[2])%1;dot(x,(A1.x+(B1.x-A1.x)*k)*w,(A1.y+(B1.y-A1.y)*k)*h,1.5,.75)});
      s.n.forEach(function(n){var pl=.55+.45*Math.sin(t*1.6+n.p);dot(x,n.x*w,n.y*h,2.2,.35+.5*pl);x.strokeStyle=A(.12*pl);x.beginPath();x.arc(n.x*w,n.y*h,6+4*pl,0,7);x.stroke()});
    },
    /* III · Syllabus: un programa de curso cuyas referencias se verifican y su cobertura crece */
    syllabus:function(x,w,h,t){
      var s=Math.min(w*.78,h*.95),cx=w*.38,cy=h/2,pw=s*.62,ph=s*.82,px=cx-pw/2,py=cy-ph/2,rows=6,cyc=(t*.55)%(rows+3);
      x.fillStyle=A(.04);x.fillRect(px,py,pw,ph);x.strokeStyle=A(.5);x.lineWidth=1;x.strokeRect(px+.5,py+.5,pw,ph);
      x.font='700 '+Math.round(s*.042)+'px "Segoe UI",sans-serif';x.fillStyle=A(.8);x.fillText('SYLLABUS',px+pw*.08,py+ph*.1);
      line(x,px+pw*.08,py+ph*.14,px+pw*.92,py+ph*.14,.3,1);
      var done=0,dy=ph*.12,r=s*.026;
      for(var i=0;i<rows;i++){var y=py+ph*.24+i*dy,pr=Math.max(0,Math.min(1,cyc-i));if(pr<=0)continue;
        var ww=pw*.62*Math.min(1,pr*1.5);line(x,px+pw*.08,y,px+pw*.08+ww,y,.6,1.6);
        line(x,px+pw*.14,y+dy*.3,px+pw*.14+pw*.48*Math.max(0,Math.min(1,pr*1.5-.5)),y+dy*.3,.28,1.2);
        if(pr>=1){done++;var ccx=px+pw*.86,ccy=y+dy*.12;x.strokeStyle=A(.75);x.lineWidth=1.2;x.beginPath();x.arc(ccx,ccy,r,0,7);x.stroke();
          x.lineWidth=1.6;x.beginPath();x.moveTo(ccx-r*.45,ccy);x.lineTo(ccx-r*.1,ccy+r*.38);x.lineTo(ccx+r*.5,ccy-r*.4);x.stroke()}}
      var pct=Math.round(done/rows*100),rx=px+pw+s*.2,ry=cy,rr=s*.13;
      x.strokeStyle=A(.15);x.lineWidth=s*.022;x.beginPath();x.arc(rx,ry,rr,0,7);x.stroke();
      x.strokeStyle=A(.9);x.beginPath();x.arc(rx,ry,rr,-Math.PI/2,-Math.PI/2+Math.PI*2*done/rows);x.stroke();
      x.font='700 '+Math.round(s*.06)+'px "Segoe UI",sans-serif';x.textAlign='center';x.fillStyle=A(.95);x.fillText(pct+'%',rx,ry+s*.02);
      x.font='600 '+Math.round(s*.03)+'px "Segoe UI",sans-serif';x.fillStyle=A(.6);x.fillText('COBERTURA',rx,ry+rr+s*.07);x.textAlign='left';
    },
    /* IV · Adquisiciones: libros nuevos que se suman a la colección */
    adq:function(x,w,h,t){
      var base=h*.85,n=10,cyc=(t*.6)%(n+3),bw=w*.55,bx=w*.2,bh=Math.min(10,(h*.62)/n);
      line(x,bx-10,base,bx+bw+10,base,.35);
      for(var i=0;i<n;i++){var k=cyc-i;if(k<0)continue;var f=Math.min(1,k),ty=base-(i+1)*bh,y=ty-(1-f)*(1-f)*h*.6,off=((i*37)%13)-6;
        x.fillStyle=A(.1+.05*(i%3));x.fillRect(bx+off,y,bw-((i*17)%20),bh-2);x.strokeStyle=A(.4);x.lineWidth=.8;x.strokeRect(bx+off,y,bw-((i*17)%20),bh-2)}
      var c=Math.min(n,Math.floor(cyc));x.font='600 10px "Segoe UI",sans-serif';x.fillStyle=A(.55);x.fillText('+'+c,bx+bw+14,base-c*bh+6);
    },
    /* V · Recursos electrónicos: un computador conectado a una red de libros, papers y revistas */
    erec:function(x,w,h,t){
      var s=Math.min(w*.95,h*.95),cx=w*.5,cy=h/2+s*.02,mw=s*.36,mh=s*.24;
      var nodes=[[-.42,-.34,'book'],[.0,-.44,'paper'],[.42,-.34,'journal'],[-.46,.1,'paper'],[.46,.1,'book'],[-.3,.42,'journal'],[.3,.42,'paper']];
      nodes.forEach(function(n,i){var nx=cx+n[0]*s,ny=cy+n[1]*s;line(x,nx,ny,cx,cy,.16,1);
        var k=(t*.35+i/7)%1;dot(x,nx+(cx-nx)*k,ny+(cy-ny)*k,s*.008,.85*Math.sin(k*Math.PI));
        var u=s*.06;x.strokeStyle=A(.6);x.lineWidth=1;x.fillStyle=BG;
        if(n[2]==='book'){x.fillRect(nx-u*.6,ny-u*.8,u*1.2,u*1.6);x.strokeRect(nx-u*.6,ny-u*.8,u*1.2,u*1.6);line(x,nx-u*.35,ny-u*.8,nx-u*.35,ny+u*.8,.6,1)}
        else if(n[2]==='paper'){x.beginPath();x.moveTo(nx-u*.55,ny-u*.8);x.lineTo(nx+u*.25,ny-u*.8);x.lineTo(nx+u*.55,ny-u*.5);x.lineTo(nx+u*.55,ny+u*.8);x.lineTo(nx-u*.55,ny+u*.8);x.closePath();x.fill();x.stroke();
          for(var r=0;r<3;r++)line(x,nx-u*.35,ny-u*.25+r*u*.35,nx+u*.35,ny-u*.25+r*u*.35,.45,1)}
        else{x.fillRect(nx-u*.65,ny-u*.75,u*1.3,u*1.5);x.strokeRect(nx-u*.65,ny-u*.75,u*1.3,u*1.5);line(x,nx-u*.45,ny-u*.4,nx+u*.45,ny-u*.4,.6,1.4);
          x.strokeRect(nx-u*.45,ny-u*.15,u*.9,u*.6)}});
      x.fillStyle=BG;x.fillRect(cx-mw/2,cy-mh/2,mw,mh);x.strokeStyle=A(.85);x.lineWidth=1.2;x.strokeRect(cx-mw/2,cy-mh/2,mw,mh);
      line(x,cx,cy+mh/2,cx,cy+mh/2+s*.05,.7,1.2);line(x,cx-s*.07,cy+mh/2+s*.05,cx+s*.07,cy+mh/2+s*.05,.7,1.2);
      var bars=6;for(var b=0;b<bars;b++){var bh=mh*.55*(.35+.65*Math.abs(Math.sin(t*.8+b*.9)));x.fillStyle=A(.45);x.fillRect(cx-mw*.36+b*mw*.13,cy+mh*.32-bh,mw*.08,bh)}
    },
    /* VI · Marbetes: una signatura que se imprime en el marbete */
    marbetes:function(x,w,h,t){
      var lh=Math.min(h*.7,w*.8),lw=lh*.6,lx=(w-lw)/2,ly=(h-lh)/2;x.strokeStyle=A(.55);x.lineWidth=1;x.strokeRect(lx,ly,lw,lh);line(x,lx,ly+lh*.2,lx+lw,ly+lh*.2,.25);
      var L=['QA','76.9','.D3','2026'],tot=L.join('').length,k=Math.floor((t*7)%(tot+16)),c=0;
      x.font='600 '+Math.max(11,Math.min(16,lh*.13))+'px Consolas,"Courier New",monospace';x.textAlign='center';x.fillStyle=A(.85);
      L.forEach(function(s,i){var vis=Math.max(0,Math.min(s.length,k-c));x.fillText(s.slice(0,vis),lx+lw/2,ly+lh*.36+i*lh*.17);c+=s.length});x.textAlign='left';
      if(k<tot&&Math.floor(t*3)%2===0){dot(x,lx+lw*.82,ly+lh*.1,1.8,.7)}
    },
    /* VII · MARC: registro bibliográfico leído campo a campo */
    marc:function(x,w,h,t){
      var R=[['LDR','00000nam a22'],['001','991234'],['020','$a 978…'],['100','1_ $a Autor'],['245','10 $a Título'],['650','_0 $a Materia']];
      var y0=h*.14,dy=(h*.74)/R.length,sel=Math.floor(t*1.2)%R.length;x.font='600 11px Consolas,"Courier New",monospace';
      R.forEach(function(r,i){var y=y0+i*dy+dy*.6;if(i===sel){x.fillStyle=A(.08);x.fillRect(w*.1,y-dy*.7,w*.8,dy*.9)}
        x.fillStyle=A(i===sel?.95:.4);x.fillText(r[0],w*.14,y);x.fillStyle=A(i===sel?.8:.25);x.fillText(r[1],w*.3,y)});
    },
    /* VIII · Automatización: un sistema solar; los procesos automáticos llegan a cada área */
    auto:function(x,w,h,t){
      var s=Math.min(w*.72,h*1.2),cx=w*.5,cy=h/2;
      var AR=[['Biblioteca A',0],['Biblioteca F',1],['Biblioteca Viña del Mar',2],['Biblioteca Posgrado',0],['Dirección',1],['Adquisiciones',2],['Analista',1],['Procesamiento y Metadatos',2],['Difusión',0],['Informática',1]];
      var orb=[.2,.33,.46],tilt=.72,P=[];
      orb.forEach(function(o){x.strokeStyle=A(.13);x.lineWidth=1;x.beginPath();x.ellipse(cx,cy,o*s,o*s*tilt,0,0,7);x.stroke()});
      var cnt=[0,0,0],tot=[0,0,0];AR.forEach(function(a){tot[a[1]]++});
      AR.forEach(function(a){var o=a[1],i=cnt[o]++,sp=[.22,-.15,.1][o],an=t*sp+i*(6.283/tot[o])+o*.7;
        P.push({x:cx+Math.cos(an)*orb[o]*s,y:cy+Math.sin(an)*orb[o]*s*tilt,d:Math.sin(an),n:a[0]})});
      P.forEach(function(p,i){var k=((t*.3)+i*.37)%1;line(x,cx,cy,p.x,p.y,.07,1);dot(x,cx+(p.x-cx)*k,cy+(p.y-cy)*k,s*.006,.7*Math.sin(k*Math.PI))});
      var g=x.createRadialGradient(cx,cy,0,cx,cy,s*.11);g.addColorStop(0,A(.5));g.addColorStop(.4,A(.15));g.addColorStop(1,A(0));x.fillStyle=g;x.beginPath();x.arc(cx,cy,s*.11,0,7);x.fill();
      dot(x,cx,cy,s*.03,.95);
      P.sort(function(a,b){return a.d-b.d}).forEach(function(p){var dep=.35+.65*(p.d+1)/2;dot(x,p.x,p.y,s*.012*(.7+.5*dep),.4+.6*dep);
        x.font='600 '+Math.max(10,Math.round(s*.026))+'px "Segoe UI",sans-serif';x.textAlign='center';var la=Math.max(0,Math.min(1,(p.d+.15)/.5));if(la>0){x.fillStyle=A(.95*la);x.fillText(p.n,p.x,p.y-s*.03)};x.textAlign='left'});
    },
  };


  /* --- efectos plateados --- */
  function silverSheen(x,w,h,t){x.save();x.globalCompositeOperation='source-atop';
    var p=((t*.11)%1.7)-.35,g=x.createLinearGradient(w*(p-.4),0,w*(p+.4),h*.6);
    g.addColorStop(0,'#555');g.addColorStop(.4,'#8c8c8c');g.addColorStop(.5,'#f2f2f2');g.addColorStop(.6,'#8c8c8c');g.addColorStop(1,'#555');
    x.fillStyle=g;x.fillRect(0,0,w,h);x.restore()}
  function sparkle(x,cx,cy,r,a){x.save();x.globalAlpha=Math.max(0,a);
    var g=x.createRadialGradient(cx,cy,0,cx,cy,r*1.8);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(170,170,170,.55)');g.addColorStop(1,'rgba(170,170,170,0)');
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*1.8,0,7);x.fill();
    var s=x.createLinearGradient(cx-r*2.6,cy,cx+r*2.6,cy);s.addColorStop(0,'rgba(110,110,110,0)');s.addColorStop(.5,'rgba(110,110,110,.95)');s.addColorStop(1,'rgba(110,110,110,0)');
    x.strokeStyle=s;x.lineWidth=1;x.beginPath();x.moveTo(cx-r*2.6,cy);x.lineTo(cx+r*2.6,cy);x.stroke();
    var v=x.createLinearGradient(cx,cy-r*2.6,cx,cy+r*2.6);v.addColorStop(0,'rgba(110,110,110,0)');v.addColorStop(.5,'rgba(110,110,110,.95)');v.addColorStop(1,'rgba(110,110,110,0)');
    x.strokeStyle=v;x.beginPath();x.moveTo(cx,cy-r*2.6);x.lineTo(cx,cy+r*2.6);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,r*.4,0,7);x.fill();x.restore()}
  function sparks(x,w,h,t,host){var L=host._sp||(host._sp=[]);
    if(!host._nx||t>host._nx){L.push({x:Math.random()*w,y:h*.15+Math.random()*h*.7,b:t,l:1.1+Math.random()*.8,r:2+Math.random()*2.2});host._nx=t+.35+Math.random()*.6}
    for(var i=L.length-1;i>=0;i--){var s=L[i],k=(t-s.b)/s.l;if(k>=1){L.splice(i,1);continue}sparkle(x,s.x,s.y,s.r*(.6+.6*Math.sin(k*Math.PI)),Math.sin(k*Math.PI))}}

  var c=document.getElementById('cv'),dpr=window.devicePixelRatio||1;
  function frame(){T+=.016;var w=c.clientWidth,h=c.clientHeight;
    if(w&&h){if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
      var x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);D[k](x,w,h,T);if(CLARO&&!x._own){silverSheen(x,w,h,T)}}
    requestAnimationFrame(frame)}
  frame();
