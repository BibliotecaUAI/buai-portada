<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap">
<title>Portada BUAI</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .p{position:relative;height:100%;min-height:420px;box-sizing:border-box;padding:clamp(16px,3vw,28px) clamp(10px,1.5vw,18px);display:flex;flex-direction:column;justify-content:space-between;gap:clamp(16px,3vh,28px);overflow:hidden;
     background:#000}

  /* Textura de metal cepillado */
  .p::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.15;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 75%);
     background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

  /* Reflejo metalizado continuo, dos capas a distinto ritmo */
  .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%)}
  .shine{position:absolute;inset:-50%;pointer-events:none;mix-blend-mode:screen}
  .s1{background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.04) 48%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 52%,transparent 58%);animation:sweep 17s ease-in-out infinite}
  .s2{background:linear-gradient(100deg,transparent 45%,rgba(220,225,235,.03) 50%,transparent 55%);animation:sweep 29s ease-in-out infinite reverse;animation-delay:-11s}
  @keyframes sweep{0%{transform:translateX(-35%)}50%{transform:translateX(35%)}100%{transform:translateX(-35%)}}

  .mast{position:relative;z-index:2;border-top:3px double #fff;border-bottom:1px solid #fff;padding:10px 0;display:flex;justify-content:space-between;font-size:clamp(10px,1.2vw,13px);font-weight:700;letter-spacing:3px;text-transform:uppercase}

  /* Ventana translúcida central con el título adentro */
  .win{position:relative;z-index:2;flex:1;width:100%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.22);border-radius:6px;overflow:hidden;
       background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.005));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
       opacity:0;animation:in 1.2s ease .3s forwards}
  .win canvas{position:absolute;inset:0;width:100%;height:100%}
  h1{position:relative;z-index:1;text-align:center;font-family:"Segoe UI","Selawik","Open Sans",system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4.3vw,58px);line-height:1.12;margin:0;padding:0 16px;
     background:linear-gradient(100deg,#9a9a9a 0%,#ffffff 30%,#c9c9c9 50%,#ffffff 70%,#9a9a9a 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 9s ease-in-out infinite}
  @keyframes metal{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  @keyframes in{to{opacity:1}}

  .cols{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #fff;text-align:left}
  .cols div{padding:14px 18px 0;border-right:1px solid rgba(255,255,255,.35)}
  .cols div:last-child{border-right:none}
  .cols b{display:block;font-weight:700;font-size:clamp(13px,1.5vw,17px)}
  .cols small{display:block;font-size:12px;opacity:.85;margin-top:4px;line-height:1.4}

  @media (max-width:700px){
    .cols{grid-template-columns:repeat(2,1fr)}
    .cols div:nth-child(2){border-right:none}
    .cols small{display:none}
  }

  /* ===== versión blanca y plateada ===== */
  html,body{background:#fff;color:#1c1c1c}
  .p{background:#fff}
  .p::before{opacity:0}
  .shine{mix-blend-mode:normal}
  .s1{background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.0) 46%,rgba(230,230,230,.55) 50%,rgba(255,255,255,0) 54%,transparent 56%)}
  .s2{background:none}
  .mast{border-top:3px double #8f8f8f;border-bottom:1px solid #b9b9b9}
  .win{border:1px solid #cfcfcf;background:linear-gradient(180deg,#fdfdfd,#eeeeee);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.06)}
  .win::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:6px;padding:1px;background:linear-gradient(90deg,transparent,#8f8f8f 15%,#e6e6e6 50%,#8f8f8f 85%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  h1{background:linear-gradient(100deg,#1c1c1c 0%,#1c1c1c 42%,#9d9d9d 47%,#f1f1f1 50%,#9d9d9d 53%,#1c1c1c 58%,#1c1c1c 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tshine 6s ease-in-out infinite}
  @keyframes tshine{0%{background-position:110% 0}60%,100%{background-position:-10% 0}}
  .cols{border-top:1px solid #9a9a9a}
  .cols div{border-right:1px solid #cfcfcf}


  /* ===== Paleta BUAI · tinta (boceto) ===== */
  html,body{background:#fff;color:#1c1c1c}
  .mast,.head{border-top:3px double #111!important;border-bottom:1px solid #111!important}
  @keyframes tinta{0%{background-position:110% 0}60%,100%{background-position:-10% 0}}
  .line{background:linear-gradient(90deg,transparent,#111 20%,#8a8a8a 50%,#111 80%,transparent)!important;height:1.5px}
  .line::after{background:radial-gradient(ellipse at center,#fff 0%,rgba(255,255,255,.85) 35%,rgba(255,255,255,0) 70%)!important;box-shadow:0 0 8px 2px rgba(255,255,255,.7)!important}
  .mast span:last-child,.mast a,.head span:last-child{color:#111!important;opacity:.85!important}
  .kick,.vol{color:#111!important;opacity:1!important}
  .sub,#q{color:#111!important}
  .h{color:#111!important}.h::after{background:linear-gradient(90deg,#111,transparent)!important}
  .s,.c,.st,.cols div{border-right-color:#9a9a9a!important}
  .tags span{background:#fff!important;border:1px solid #cfcfcf!important;border-radius:999px!important;padding:5px 12px!important;color:#1c1c1c}

  h1{background:linear-gradient(100deg,#111 0%,#111 44%,#2a2a2a 48%,#6a6a6a 50%,#2a2a2a 52%,#111 56%,#111 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tinta 7s ease-in-out infinite}
  .win{border:1px solid #e3e3e3;border-radius:18px;background:#fff;box-shadow:0 18px 40px -26px rgba(0,0,0,.45)}
  .win{align-items:flex-start}
  h1{margin-top:clamp(14px,3.5vh,30px)}
  .win::after{border-radius:18px;background:linear-gradient(90deg,transparent,#111 15%,#b5b5b5 50%,#111 85%,transparent)}
  .cols{border-top:1px solid #111}.cols div{border-right-color:#d6d6d6}
</style>
</head>
<body>
<div class="p">
  <div class="fx"><div class="shine s1"></div><div class="shine s2"></div></div>

  <div class="mast"><span>Universidad Adolfo Ibáñez</span><span class="mes"></span></div>

  <div class="win">
    <canvas id="net" aria-hidden="true"></canvas>
    <h1>Análisis de Servicios y Datos<br>Bibliotecas UAI</h1>
  </div>

  <div class="cols">
    <div><b>Métricas generales</b><small>La foto completa</small></div>
    <div><b>Detalle</b><small>Cada servicio por separado</small></div>
    <div><b>Análisis</b><small>Tendencias y causas</small></div>
    <div><b>Decisiones sugeridas</b><small>Qué hacer con los datos</small></div>
  </div>
</div>
<script>
  /* --- efectos plateados --- */
  function silverSheen(x,w,h,t){x.save();x.globalCompositeOperation='source-atop';
    var p=((t*.11)%1.7)-.35,g=x.createLinearGradient(w*(p-.4),0,w*(p+.4),h*.6);
    g.addColorStop(0,'#111');g.addColorStop(.4,'#1c1c1c');g.addColorStop(.5,'#5a5a5a');g.addColorStop(.6,'#1c1c1c');g.addColorStop(1,'#111');
    x.fillStyle=g;x.fillRect(0,0,w,h);x.restore()}
  function sparkle(x,cx,cy,r,a){x.save();x.globalAlpha=Math.max(0,a);
    var g=x.createRadialGradient(cx,cy,0,cx,cy,r*1.8);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(170,170,170,.55)');g.addColorStop(1,'rgba(170,170,170,0)');
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*1.8,0,7);x.fill();
    var s=x.createLinearGradient(cx-r*2.6,cy,cx+r*2.6,cy);s.addColorStop(0,'rgba(110,110,110,0)');s.addColorStop(.5,'rgba(110,110,110,.95)');s.addColorStop(1,'rgba(110,110,110,0)');
    x.strokeStyle=s;x.lineWidth=1;x.beginPath();x.moveTo(cx-r*2.6,cy);x.lineTo(cx+r*2.6,cy);x.stroke();
    var v=x.createLinearGradient(cx,cy-r*2.6,cx,cy+r*2.6);v.addColorStop(0,'rgba(110,110,110,0)');v.addColorStop(.5,'rgba(110,110,110,.95)');v.addColorStop(1,'rgba(110,110,110,0)');
    x.strokeStyle=v;x.beginPath();x.moveTo(cx,cy-r*2.6);x.lineTo(cx,cy+r*2.6);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,r*.4,0,7);x.fill();x.restore()}
  function sparks(x,w,h,t,host){var L=host._sp||(host._sp=[]);
    if(!host._nx||t>host._nx){L.push({x:Math.random()*w,y:h*.15+Math.random()*h*.7,b:t,l:1.1+Math.random()*.8,r:2+Math.random()*2.2});host._nx=t+.35+Math.random()*.6}
    for(var i=L.length-1;i>=0;i--){var s=L[i],k=(t-s.b)/s.l;if(k>=1){L.splice(i,1);continue}sparkle(x,s.x,s.y,s.r*(.6+.6*Math.sin(k*Math.PI)),Math.sin(k*Math.PI))}}

  var m=new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'}).replace(' de ',' ');
  document.querySelectorAll('.mes').forEach(function(e){e.textContent=m});

  // Lomos de libros que se mueven como un gráfico, apoyados en la línea inferior
  var c=document.getElementById('net'),x=c.getContext('2d'),w,h,d=window.devicePixelRatio||1,t=0,N=44,B=[];
  function size(){w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}
  size();window.addEventListener('resize',size);
  for(var i=0;i<N;i++)B.push({ph:Math.random()*6.28,s:.4+Math.random()*.6,tone:.25+Math.random()*.6});
  /* libros negros, plomo y claros; los más altos llegan justo bajo el título */
  B=[];for(var i=0;i<N;i++){var r=Math.random();B.push({ph:Math.random()*6.28,s:.4+Math.random()*.6,k:r<.38?0:r<.72?1:2})}
  var win=document.querySelector('.win'),ttl=document.querySelector('.win h1');
  var COL=[['#000','#2e2e31','#0a0a0a','#8a8a8a'],['#5a5a5e','#acacb0','#66666a','#ededed'],['#d4d4d7','#f6f6f7','#c8c8cb','#111']];
  function draw(){
    x.clearRect(0,0,w,h);t+=.012;
    var wr=win.getBoundingClientRect(),tb=ttl.getBoundingClientRect().bottom-wr.top+8,base=h,maxH=Math.max(40,base-tb),bw=w/N,line=[];
    B.forEach(function(b,i){
      var v=.5+.4*(i/N)+.1*Math.sin(t*b.s+b.ph);v=Math.min(v,1);
      var bh=maxH*v,bx=i*bw+bw*.1,ww=bw*.8,c=COL[b.k],g=x.createLinearGradient(bx,0,bx+ww,0);
      g.addColorStop(0,c[0]);g.addColorStop(.5,c[1]);g.addColorStop(1,c[2]);
      x.fillStyle=g;x.fillRect(bx,base-bh,ww,bh);
      if(b.k===2){x.strokeStyle='rgba(17,17,17,.55)';x.lineWidth=1;x.strokeRect(bx+.5,base-bh+.5,ww-1,bh)}
      x.fillStyle=c[3];x.fillRect(bx+ww*.15,base-bh+bh*.08,ww*.7,1.2);x.fillRect(bx+ww*.15,base-bh*.12,ww*.7,1.2);
      line.push([bx+ww/2,base-bh-7]);
    });
    x.strokeStyle='#111';x.lineWidth=1.4;x.beginPath();
    line.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke();
    /* destello que recorre los lomos */
    x.save();x.globalCompositeOperation='source-atop';var q=((t*.12)%1.6)-.3,gl=x.createLinearGradient(w*(q-.12),0,w*(q+.12),0);
    gl.addColorStop(0,'rgba(255,255,255,0)');gl.addColorStop(.5,'rgba(255,255,255,.4)');gl.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gl;x.fillRect(0,0,w,h);x.restore();
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
